<!-- builder.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio Builder</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <div class="builder-container">

    <div class="builder-left glass-card">

      <h1>Create Portfolio</h1>

      <form id="portfolioForm">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="text" id="role" placeholder="Your Role">

        <textarea id="about" placeholder="About You"></textarea>

        <input type="text" id="skills" placeholder="Skills (comma separated)">

        <input type="text" id="projects" placeholder="Projects (comma separated)">

        <select id="theme">
          <option value="dark">Dark Theme</option>
          <option value="light">Light Theme</option>
          <option value="purple">Purple Theme</option>
        </select>

        <button type="submit" class="primary-btn">
          Generate Portfolio
        </button>

      </form>

    </div>

    <div class="builder-right glass-card">

      <h2>Live Preview</h2>

      <div class="mini-preview">

        <h1 id="liveName">Your Name</h1>

        <h3 id="liveRole">UI/UX Designer</h3>

        <p id="liveAbout">
          Your portfolio preview appears here.
        </p>

        <div class="skills-preview" id="liveSkills">
          <span>Figma</span>
        </div>

      </div>

    </div>

  </div>

  <script src="js/builder.js"></script>

</body>
</html>
